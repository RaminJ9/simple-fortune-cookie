name: CI pipeline
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: clone down repository
        uses: actions/checkout@v4
      - name: download Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: build backend
        run: go build
        working-directory: backend
      - name: build frontend 
        run: go build
        working-directory: frontend
      - name: testing
        run: go test
        working-directory: frontend

        
